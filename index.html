<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>けん玉チャレンジ</title>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root{
    --bg:#171310;
    --panel:#241d18;
    --panel-edge:#332922;
    --key:#3a2f27;
    --key-active:#4a3c31;
    --cream:#efe7da;
    --dim:#9a8f80;
    --accent:#c1502e;
    --accent-dark:#9c3f24;
    --gold:#e8b64a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--cream);
    font-family:"Hiragino Sans","Noto Sans JP",sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding:20px 16px 40px;
  }
  .header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:18px;
  }
  .header h1{ font-size:1.7rem; margin:0; letter-spacing:0.02em; }
  .header h1 .accent{ color:var(--accent); }
  .who{ font-size:0.8rem; color:var(--dim); text-align:right; }
  .tabs{
    display:flex; background:var(--panel); border:1px solid var(--panel-edge);
    border-radius:14px; padding:5px; gap:4px; margin-bottom:18px;
  }
  .tab{
    flex:1; text-align:center; padding:12px 4px; border-radius:10px;
    font-size:0.95rem; color:var(--dim); cursor:pointer; user-select:none;
  }
  .tab.active{ background:var(--key-active); color:var(--cream); }
  .panel{ display:none; }
  .panel.active{ display:block; }
  .board{
    background:var(--panel); border:1px solid var(--panel-edge); border-radius:20px;
    padding:28px 20px; text-align:center; margin-bottom:14px;
  }
  .board .label{ color:var(--dim); font-size:0.9rem; letter-spacing:0.3em; margin-bottom:8px; }
  .board .count{ font-size:5.2rem; font-weight:700; line-height:1; }
  .board .unit{
    font-size:1.4rem; color:var(--dim); border:2px solid var(--dim); border-radius:6px;
    padding:0 6px; vertical-align:middle; margin-left:6px;
  }
  .keypad{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:18px; }
  .key{
    background:var(--key); border:1px solid var(--panel-edge); border-radius:16px;
    padding:26px 0; text-align:center; font-size:2rem; color:var(--cream);
    cursor:pointer; user-select:none; transition:background 0.1s;
  }
  .key:active{ background:var(--key-active); }
  .submit-btn{
    display:block; width:100%; background:var(--accent); border:none; border-radius:16px;
    padding:20px 0; font-size:1.15rem; font-weight:700; color:var(--cream); cursor:pointer;
  }
  .submit-btn:active{ background:var(--accent-dark); }
  .submit-btn .accent-word{ color:#2a1710; }
  .msg{ text-align:center; font-size:0.85rem; min-height:1.2em; margin:10px 0 0; }
  .msg.ok{ color:#8fd19e; }
  .msg.err{ color:#e08a7a; }
  .rank-tabs{ display:flex; gap:8px; margin-bottom:12px; }
  .rank-tab{
    flex:1; text-align:center; padding:8px 0; border-radius:10px; background:var(--panel);
    border:1px solid var(--panel-edge); color:var(--dim); font-size:0.85rem; cursor:pointer;
  }
  .rank-tab.active{ color:var(--cream); border-color:var(--accent); }
  .row{
    background:var(--panel); border:1px solid var(--panel-edge);
    border-radius:14px; padding:14px 16px; margin-bottom:8px;
  }
  .row.top3{ border-color:var(--gold); }
  .row.me{ border-color:var(--accent); }
  .row-main{ display:flex; align-items:center; }
  .rk{ width:34px; font-size:1.1rem; text-align:center; }
  .nm{ flex:1; font-size:1rem; padding-left:8px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ct{ font-size:1.3rem; font-weight:700; }
  .ct small{ font-size:0.75rem; color:var(--dim); margin-left:2px; font-weight:400; }
  .empty{ color:var(--dim); text-align:center; padding:30px 0; font-size:0.9rem; }
  .legend{ display:flex; flex-wrap:wrap; gap:8px 14px; margin-bottom:14px; font-size:0.8rem; }
  .legend-item{ display:flex; align-items:center; gap:6px; color:var(--dim); }
  .legend-dot{ width:10px; height:10px; border-radius:50%; }
  canvas{ width:100%; height:420px; display:block; }

  /* ===== 目標まわり ===== */
  .goal-card{
    background:var(--panel); border:1px solid var(--panel-edge); border-radius:16px;
    padding:14px 16px; margin-bottom:18px;
  }
  .goal-top{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; }
  .goal-label{ font-size:0.75rem; color:var(--dim); margin-bottom:2px; }
  .goal-val{ font-size:1.1rem; font-weight:700; color:var(--gold); }
  .goal-val small{ font-size:0.75rem; color:var(--dim); font-weight:400; margin-left:4px; }
  .goal-val.none{ color:var(--dim); font-weight:400; font-size:0.95rem; }
  .goal-set{
    flex:none; background:transparent; border:1px solid var(--panel-edge); color:var(--dim);
    border-radius:10px; font-size:0.75rem; padding:7px 12px; cursor:pointer; font-family:inherit;
  }
  .bar{ height:8px; background:#14100d; border-radius:99px; overflow:hidden; }
  .bar span{ display:block; height:100%; width:0; background:var(--accent); border-radius:99px; transition:width 0.4s; }
  .bar.done span{ background:var(--gold); }
  .goal-foot{ display:flex; justify-content:space-between; font-size:0.75rem; color:var(--dim); margin-top:7px; }
  .goal-foot b{ color:var(--cream); }

  .row-goal{ margin-top:10px; }
  .row-goal .bar{ height:6px; }
  .row-goal .g-foot{ display:flex; justify-content:space-between; font-size:0.72rem; color:var(--dim); margin-top:5px; }
  .row-goal .g-foot b{ color:var(--cream); }

  /* ===== 目標設定モーダル ===== */
  .modal{
    position:fixed; inset:0; background:rgba(10,8,6,0.8); z-index:50;
    display:none; align-items:flex-end; justify-content:center;
  }
  .modal.open{ display:flex; }
  .sheet{
    width:100%; max-width:520px; background:var(--bg);
    border-top-left-radius:22px; border-top-right-radius:22px;
    border-top:1px solid var(--panel-edge);
    padding:22px 16px calc(24px + env(safe-area-inset-bottom));
    max-height:92vh; overflow-y:auto;
  }
  .sheet h2{ margin:0 0 4px; font-size:1.2rem; }
  .sheet .lead{ font-size:0.8rem; color:var(--dim); line-height:1.6; margin:0 0 16px; }
  .sheet .board{ padding:20px; margin-bottom:14px; }
  .sheet .board .count{ font-size:3.6rem; }
  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:0.78rem; color:var(--dim); margin-bottom:7px; }
  .field input[type=date]{
    width:100%; background:var(--key); border:1px solid var(--panel-edge); color:var(--cream);
    font-family:inherit; font-size:1rem; padding:13px 14px; border-radius:12px;
  }
  .quick{ display:flex; gap:8px; margin-top:8px; }
  .quick button{
    flex:1; background:var(--panel); border:1px solid var(--panel-edge); color:var(--dim);
    font-family:inherit; font-size:0.75rem; padding:9px 0; border-radius:10px; cursor:pointer;
  }
  .quick button.active{ border-color:var(--accent); color:var(--cream); }
  .sheet-actions{ display:flex; gap:10px; margin-top:6px; }
  .sheet-actions button{
    flex:1; border:none; border-radius:14px; padding:16px 0;
    font-size:1rem; font-weight:700; font-family:inherit; cursor:pointer;
  }
  .btn-cancel{ background:var(--key); color:var(--dim); }
  .btn-save{ background:var(--accent); color:var(--cream); }
  .btn-save:active{ background:var(--accent-dark); }
</style>
</head>
<body>

<div class="header">
  <h1>けん玉<span class="accent">チャレンジ</span></h1>
  <div class="who" id="who">読み込み中...</div>
</div>

<div class="tabs">
  <div class="tab active" data-tab="record">記録する</div>
  <div class="tab" data-tab="ranking">ランキング</div>
  <div class="tab" data-tab="trend">推移</div>
</div>

<div class="panel active" id="panel-record">
  <div class="board">
    <div class="label">連続回数</div>
    <div><span class="count" id="countDisplay">0</span><span class="unit">回</span></div>
  </div>

  <div class="goal-card">
    <div class="goal-top">
      <div>
        <div class="goal-label">わたしの目標</div>
        <div class="goal-val none" id="goalVal">未設定</div>
      </div>
      <button class="goal-set" id="goalSetBtn">目標を設定</button>
    </div>
    <div class="bar" id="goalBar"><span></span></div>
    <div class="goal-foot">
      <div id="goalNow">今週ベスト <b>0</b>回</div>
      <div id="goalRate"></div>
    </div>
  </div>

  <div class="keypad" id="keypad">
    <div class="key" data-k="1">1</div>
    <div class="key" data-k="2">2</div>
    <div class="key" data-k="3">3</div>
    <div class="key" data-k="4">4</div>
    <div class="key" data-k="5">5</div>
    <div class="key" data-k="6">6</div>
    <div class="key" data-k="7">7</div>
    <div class="key" data-k="8">8</div>
    <div class="key" data-k="9">9</div>
    <div class="key" data-k="C">C</div>
    <div class="key" data-k="0">0</div>
    <div class="key" data-k="DEL">⌫</div>
  </div>
  <button class="submit-btn" id="submitBtn">
    けん玉<span class="accent-word">チャレンジ</span> この回数で記録する
  </button>
  <div class="msg" id="msg"></div>
</div>

<div class="panel" id="panel-ranking">
  <div class="rank-tabs">
    <div class="rank-tab active" data-period="thisWeek">今週</div>
    <div class="rank-tab" data-period="lastWeek">先週</div>
  </div>
  <div class="rank-tabs">
    <div class="rank-tab active" data-rscope="all">全員</div>
    <div class="rank-tab" data-rscope="self">自分だけ</div>
  </div>
  <div id="rankingList"><div class="empty">読み込み中...</div></div>
</div>

<div class="panel" id="panel-trend">
  <div class="rank-tabs">
    <div class="rank-tab active" data-scope="self">自分だけ</div>
    <div class="rank-tab" data-scope="all">全員</div>
  </div>
  <div class="legend" id="legend"></div>
  <canvas id="trendCanvas"></canvas>
</div>

<!-- 目標設定モーダル -->
<div class="modal" id="goalModal">
  <div class="sheet">
    <h2>目標を設定する</h2>
    <p class="lead">達成したい連続回数と期限を決めましょう。<br>期限が過ぎても目標はそのまま残ります。総合目標にしたいときは「期限なし」を選んでください。</p>

    <div class="board">
      <div class="label">目標の連続回数</div>
      <div><span class="count" id="goalCountDisplay">0</span><span class="unit">回</span></div>
    </div>

    <div class="keypad" id="goalKeypad">
      <div class="key" data-k="1">1</div>
      <div class="key" data-k="2">2</div>
      <div class="key" data-k="3">3</div>
      <div class="key" data-k="4">4</div>
      <div class="key" data-k="5">5</div>
      <div class="key" data-k="6">6</div>
      <div class="key" data-k="7">7</div>
      <div class="key" data-k="8">8</div>
      <div class="key" data-k="9">9</div>
      <div class="key" data-k="C">C</div>
      <div class="key" data-k="0">0</div>
      <div class="key" data-k="DEL">⌫</div>
    </div>

    <div class="field">
      <label>期限</label>
      <input type="date" id="goalDate">
      <div class="quick" id="goalQuick">
        <button data-m="1">1ヶ月後</button>
        <button data-m="3">3ヶ月後</button>
        <button data-m="0">期限なし</button>
      </div>
    </div>

    <div class="msg" id="goalMsg"></div>
    <div class="sheet-actions">
      <button class="btn-cancel" id="goalCancel">キャンセル</button>
      <button class="btn-save" id="goalSave">保存する</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   設定：GASのウェブアプリURLとLIFF IDをここに入れてください
   ============================================================ */
var GAS_URL = 'https://script.google.com/macros/s/AKfycbxxEkPwBfrblKjZypzB_S601hdePQMzSpYHXOcsPwOltDw_haR78Os0_A2OoRaUf9L7/exec';
var LIFF_ID = '2010756814-JMY12Gib';

var USER = null;
var currentCount = '0';
var MY = { weekBest:0, goal:0, deadline:'' };   // 自分の状況

document.querySelectorAll('.tab').forEach(function(tab){
  tab.addEventListener('click', function(){
    document.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('active'); });
    document.querySelectorAll('.panel').forEach(function(p){ p.classList.remove('active'); });
    tab.classList.add('active');
    document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
    if(tab.dataset.tab === 'ranking') loadRanking();
    if(tab.dataset.tab === 'trend') loadTrend();
  });
});

document.getElementById('keypad').addEventListener('click', function(e){
  var key = e.target.closest('.key');
  if(!key) return;
  var k = key.dataset.k;
  if(k === 'C'){ currentCount = '0'; }
  else if(k === 'DEL'){ currentCount = currentCount.length>1 ? currentCount.slice(0,-1) : '0'; }
  else {
    currentCount = (currentCount === '0') ? k : (currentCount + k);
    if(currentCount.length > 5) currentCount = currentCount.slice(0,5);
  }
  document.getElementById('countDisplay').textContent = currentCount;
});

function setMsg(text, cls){
  var m = document.getElementById('msg');
  m.textContent = text;
  m.className = 'msg ' + (cls||'');
}

document.getElementById('submitBtn').addEventListener('click', function(){
  var count = Number(currentCount);
  if(!USER){
    setMsg('LINEログインの確認中です。少し待ってから再度お試しください。', 'err');
    return;
  }
  if(!count && count !== 0){
    setMsg('回数を入力してください。', 'err');
    return;
  }
  setMsg('送信中...', '');
  fetch(GAS_URL, {
    method: 'POST',
    body: JSON.stringify({
      action: 'submit',
      userId: USER.userId,
      displayName: USER.displayName,
      count: count
    })
  })
  .then(function(res){ return res.json(); })
  .then(function(json){
    if(json.ok){
      var d = json.data || {};
      var hit = MY.goal > 0 && count >= MY.goal;
      setMsg(hit ? '🎯 目標達成！ ' + count + '回を記録しました！' : count + '回を記録しました！', 'ok');
      if(typeof d.weekBest === 'number') MY.weekBest = d.weekBest;
      if(typeof d.goal === 'number') MY.goal = d.goal;
      if(typeof d.deadline === 'string') MY.deadline = d.deadline;
      renderGoalCard();
      currentCount = '0';
      document.getElementById('countDisplay').textContent = '0';
      rankingData = null;   // 次にランキングを開いたら取り直す
      trendRawData = null;
    } else {
      setMsg('記録に失敗しました：' + json.error, 'err');
    }
  })
  .catch(function(err){
    setMsg('通信エラー：' + err, 'err');
  });
});

/* ============================================================
   目標カード
   ============================================================ */
function renderGoalCard(){
  var val  = document.getElementById('goalVal');
  var bar  = document.getElementById('goalBar');
  var now  = document.getElementById('goalNow');
  var rate = document.getElementById('goalRate');

  now.innerHTML = '今週ベスト <b>' + MY.weekBest + '</b>回';

  if(!MY.goal){
    val.className = 'goal-val none';
    val.textContent = '未設定';
    bar.className = 'bar';
    bar.firstElementChild.style.width = '0%';
    rate.textContent = '';
    return;
  }
  var done = MY.weekBest >= MY.goal;
  var pct = Math.min(100, Math.round(MY.weekBest / MY.goal * 100));
  val.className = 'goal-val';
  val.innerHTML = MY.goal + '回<small>' + (MY.deadline ? deadlineLabel(MY.deadline) : '期限なし') + '</small>';
  bar.className = 'bar' + (done ? ' done' : '');
  bar.firstElementChild.style.width = pct + '%';
  rate.innerHTML = done ? '🎯 達成！' : '達成率 <b>' + pct + '%</b>';
}

function deadlineLabel(d){
  var t = new Date(d + 'T00:00:00');
  if(isNaN(t.getTime())) return d;
  var today = new Date(); today.setHours(0,0,0,0);
  var days = Math.round((t - today) / 86400000);
  var md = (t.getMonth()+1) + '/' + t.getDate();
  if(days > 0)   return md + 'まで あと' + days + '日';
  if(days === 0) return md + '(今日まで)';
  return md + '(期限超過)';
}

/* ============================================================
   目標設定モーダル
   ============================================================ */
var goalModal   = document.getElementById('goalModal');
var goalEntry   = '0';
var goalDateEl  = document.getElementById('goalDate');
var goalMsgEl   = document.getElementById('goalMsg');

document.getElementById('goalSetBtn').addEventListener('click', function(){
  goalEntry = MY.goal ? String(MY.goal) : '0';
  document.getElementById('goalCountDisplay').textContent = goalEntry;
  goalDateEl.value = MY.deadline || addMonths(1);
  markQuick();
  goalMsgEl.textContent = ''; goalMsgEl.className = 'msg';
  goalModal.classList.add('open');
});
document.getElementById('goalCancel').addEventListener('click', function(){
  goalModal.classList.remove('open');
});
goalModal.addEventListener('click', function(e){
  if(e.target === goalModal) goalModal.classList.remove('open');
});

document.getElementById('goalKeypad').addEventListener('click', function(e){
  var key = e.target.closest('.key');
  if(!key) return;
  var k = key.dataset.k;
  if(k === 'C'){ goalEntry = '0'; }
  else if(k === 'DEL'){ goalEntry = goalEntry.length>1 ? goalEntry.slice(0,-1) : '0'; }
  else {
    goalEntry = (goalEntry === '0') ? k : (goalEntry + k);
    if(goalEntry.length > 5) goalEntry = goalEntry.slice(0,5);
  }
  document.getElementById('goalCountDisplay').textContent = goalEntry;
});

function addMonths(m){
  var d = new Date();
  d.setMonth(d.getMonth() + m);
  return d.getFullYear() + '-' + ('0'+(d.getMonth()+1)).slice(-2) + '-' + ('0'+d.getDate()).slice(-2);
}
document.getElementById('goalQuick').addEventListener('click', function(e){
  var b = e.target.closest('button');
  if(!b) return;
  var m = Number(b.dataset.m);
  goalDateEl.value = (m === 0) ? '' : addMonths(m);
  markQuick();
});
goalDateEl.addEventListener('change', markQuick);
function markQuick(){
  document.querySelectorAll('#goalQuick button').forEach(function(b){
    var m = Number(b.dataset.m);
    var v = (m === 0) ? '' : addMonths(m);
    if(goalDateEl.value === v) b.classList.add('active');
    else b.classList.remove('active');
  });
}

document.getElementById('goalSave').addEventListener('click', function(){
  var goal = Number(goalEntry);
  if(!USER){
    goalMsgEl.textContent = 'LINEログインの確認中です。少し待ってから再度お試しください。';
    goalMsgEl.className = 'msg err';
    return;
  }
  if(!goal || goal <= 0){
    goalMsgEl.textContent = '1以上の目標回数を入力してください。';
    goalMsgEl.className = 'msg err';
    return;
  }
  goalMsgEl.textContent = '保存中...'; goalMsgEl.className = 'msg';
  fetch(GAS_URL, {
    method: 'POST',
    body: JSON.stringify({
      action: 'setGoal',
      userId: USER.userId,
      displayName: USER.displayName,
      goal: goal,
      deadline: goalDateEl.value || ''
    })
  })
  .then(function(res){ return res.json(); })
  .then(function(json){
    if(json.ok){
      MY.goal = json.data.goal;
      MY.deadline = json.data.deadline || '';
      renderGoalCard();
      goalModal.classList.remove('open');
      setMsg('🎯 目標を ' + MY.goal + '回 に設定しました！', 'ok');
      rankingData = null;
      trendRawData = null;
    } else {
      goalMsgEl.textContent = '保存に失敗しました：' + json.error;
      goalMsgEl.className = 'msg err';
    }
  })
  .catch(function(err){
    goalMsgEl.textContent = '通信エラー：' + err;
    goalMsgEl.className = 'msg err';
  });
});

/* ============================================================
   ランキング
   ============================================================ */
var rankingData = null;
var currentPeriod = 'thisWeek';
var rankScope = 'all';   // 'all' or 'self'

document.querySelectorAll('#panel-ranking .rank-tab[data-period]').forEach(function(t){
  t.addEventListener('click', function(){
    document.querySelectorAll('#panel-ranking .rank-tab[data-period]').forEach(function(x){ x.classList.remove('active'); });
    t.classList.add('active');
    currentPeriod = t.dataset.period;
    renderRanking();
  });
});
document.querySelectorAll('#panel-ranking .rank-tab[data-rscope]').forEach(function(t){
  t.addEventListener('click', function(){
    document.querySelectorAll('#panel-ranking .rank-tab[data-rscope]').forEach(function(x){ x.classList.remove('active'); });
    t.classList.add('active');
    rankScope = t.dataset.rscope;
    renderRanking();
  });
});

function loadRanking(){
  if(rankingData){ renderRanking(); return; }
  document.getElementById('rankingList').innerHTML = '<div class="empty">読み込み中...</div>';
  fetch(GAS_URL + '?action=ranking')
    .then(function(res){ return res.json(); })
    .then(function(json){
      if(json.ok){
        rankingData = json.data;
        syncMyState();
        renderRanking();
      } else {
        document.getElementById('rankingList').innerHTML = '<div class="empty">読み込みに失敗しました</div>';
      }
    })
    .catch(function(){
      document.getElementById('rankingList').innerHTML = '<div class="empty">通信エラーが発生しました</div>';
    });
}

// ランキング結果から自分の今週ベスト・目標を拾って目標カードに反映
function syncMyState(){
  if(!rankingData || !USER) return;
  (rankingData.thisWeek || []).forEach(function(r){
    if(r.id === USER.userId){
      MY.weekBest = r.max;
      MY.goal = r.goal || 0;
      MY.deadline = r.deadline || '';
    }
  });
  renderGoalCard();
}

function renderRanking(){
  if(!rankingData) return;
  var list = rankingData[currentPeriod] || [];
  var box = document.getElementById('rankingList');
  if(list.length === 0){
    box.innerHTML = '<div class="empty">まだ記録がありません</div>';
    return;
  }
  var html = '';
  list.forEach(function(r, i){
    var mine = USER && r.id === USER.userId;
    if(rankScope === 'self' && !mine) return;
    var cls = (i<3 ? 'top3' : '') + (mine ? ' me' : '');
    var badge = i<3 ? ['🥇','🥈','🥉'][i] : (i+1);
    var goalHtml = '';
    if(r.goal > 0){
      var done = r.max >= r.goal;
      var pct = Math.min(100, r.rate);
      goalHtml = '<div class="row-goal">'
               +   '<div class="bar'+(done?' done':'')+'"><span style="width:'+pct+'%"></span></div>'
               +   '<div class="g-foot">'
               +     '<div>目標 <b>'+r.goal+'</b>回'+(r.deadline ? '　'+escapeHtml(deadlineLabel(r.deadline)) : '')+'</div>'
               +     '<div>'+(done ? '🎯 達成！' : '達成率 <b>'+r.rate+'%</b>')+'</div>'
               +   '</div>'
               + '</div>';
    }
    html += '<div class="row '+cls+'">'
          +   '<div class="row-main">'
          +     '<div class="rk">'+badge+'</div>'
          +     '<div class="nm">'+escapeHtml(r.name)+(mine?'（自分）':'')+'</div>'
          +     '<div class="ct">'+r.max+'<small>回</small></div>'
          +   '</div>'
          +   goalHtml
          + '</div>';
  });
  box.innerHTML = html || '<div class="empty">あなたの記録・目標はまだありません</div>';
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

/* ============================================================
   推移
   ============================================================ */
var trendScope = 'self'; // 'self' or 'all'
var trendRawData = null;
var trendColors = ['#c1502e','#e8b64a','#8fd19e','#7aa9d1','#c98a4a','#b57edc','#e07a9e','#9ad1c9','#d1c17a','#7ac9d1'];

document.querySelectorAll('#panel-trend .rank-tab').forEach(function(t){
  t.addEventListener('click', function(){
    document.querySelectorAll('#panel-trend .rank-tab').forEach(function(x){ x.classList.remove('active'); });
    t.classList.add('active');
    trendScope = t.dataset.scope;
    if(trendRawData) drawTrend(filterTrendData(trendRawData));
  });
});

function loadTrend(){
  if(trendRawData){ drawTrend(filterTrendData(trendRawData)); return; }
  fetch(GAS_URL + '?action=trend')
    .then(function(res){ return res.json(); })
    .then(function(json){
      if(json.ok){
        trendRawData = json.data;
        drawTrend(filterTrendData(trendRawData));
      }
    })
    .catch(function(){});
}

function myGoalValue(){
  if(!trendRawData || !USER) return 0;
  var g = trendRawData.goals && trendRawData.goals[USER.userId];
  return g ? Number(g.goal) : 0;
}

function filterTrendData(raw){
  var filtered;
  if(trendScope === 'all' || !USER){
    filtered = raw;
  } else {
    var mySeries = raw.series.filter(function(s){ return s.id === USER.userId; });
    filtered = { labels: raw.labels, series: mySeries };
  }
  return trimLeadingEmpty(filtered);
}

// 全系列がnull(記録なし)の先頭週を切り詰め、実データがある週から表示する
function trimLeadingEmpty(data){
  var labels = data.labels, series = data.series;
  if(!series || series.length === 0) return data;
  var firstIndex = labels.length;
  for(var i=0; i<labels.length; i++){
    var hasData = series.some(function(s){ return s.data[i] !== null; });
    if(hasData){ firstIndex = i; break; }
  }
  if(firstIndex >= labels.length) firstIndex = labels.length - 1;
  return {
    labels: labels.slice(firstIndex),
    series: series.map(function(s){ return { id:s.id, name:s.name, data:s.data.slice(firstIndex) }; })
  };
}

function drawTrend(data){
  var canvas = document.getElementById('trendCanvas');
  var ctx = canvas.getContext('2d');
  var dpr = window.devicePixelRatio || 1;
  var cssW = canvas.clientWidth || 320;
  var cssH = 420;
  canvas.width = cssW * dpr;
  canvas.height = cssH * dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,cssW,cssH);

  var labels = data.labels;
  var series = data.series;
  var goalVal = myGoalValue();
  var showValueLabels = series.length === 1;
  var padL = 40, padR = 12, padT = showValueLabels ? 28 : 14, padB = 24;
  var plotW = cssW - padL - padR;
  var plotH = cssH - padT - padB;

  var allVals = [];
  series.forEach(function(s){ s.data.forEach(function(v){ if(v!==null) allVals.push(v); }); });
  if(goalVal > 0) allVals.push(goalVal);      // 目標が収まるように縦軸を広げる
  var maxVal = allVals.length ? Math.max.apply(null, allVals) : 10;
  maxVal = Math.ceil(maxVal * 1.15) || 10;

  ctx.strokeStyle = '#332922';
  ctx.lineWidth = 1;
  ctx.font = '11px sans-serif';
  ctx.fillStyle = '#9a8f80';
  var gridLines = 8;
  for(var g=0; g<=gridLines; g++){
    var y = padT + plotH - (plotH * g / gridLines);
    ctx.beginPath();
    ctx.moveTo(padL, y);
    ctx.lineTo(cssW - padR, y);
    ctx.stroke();
    ctx.fillText(Math.round(maxVal * g / gridLines), 2, y+4);
  }
  labels.forEach(function(l, i){
    var x = padL + (plotW * i / (labels.length-1 || 1));
    ctx.fillText(l, x-12, cssH-6);
  });

  // 自分の目標ライン(金色の点線)
  if(goalVal > 0){
    var gy = padT + plotH - (plotH * goalVal / maxVal);
    ctx.save();
    ctx.setLineDash([6,5]);
    ctx.strokeStyle = '#e8b64a';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(padL, gy);
    ctx.lineTo(cssW - padR, gy);
    ctx.stroke();
    ctx.restore();
    ctx.font = 'bold 11px sans-serif';
    ctx.fillStyle = '#e8b64a';
    ctx.textAlign = 'right';
    ctx.fillText('目標 ' + goalVal + '回', cssW - padR - 2, gy - 5);
    ctx.textAlign = 'left';
    ctx.font = '11px sans-serif';
    ctx.fillStyle = '#9a8f80';
  }

  var legendHtml = '';
  series.forEach(function(s, si){
    var color = trendColors[si % trendColors.length];
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    var started = false;
    s.data.forEach(function(v, i){
      if(v === null) { started = false; return; }
      var x = padL + (plotW * i / (labels.length-1 || 1));
      var y = padT + plotH - (plotH * v / maxVal);
      if(!started){ ctx.moveTo(x,y); started = true; } else { ctx.lineTo(x,y); }
    });
    ctx.stroke();
    s.data.forEach(function(v, i){
      if(v === null) return;
      var x = padL + (plotW * i / (labels.length-1 || 1));
      var y = padT + plotH - (plotH * v / maxVal);
      ctx.beginPath();
      ctx.arc(x,y,3,0,Math.PI*2);
      ctx.fillStyle = color;
      ctx.fill();
      if(showValueLabels){
        ctx.font = 'bold 13px sans-serif';
        ctx.fillStyle = '#efe7da';
        ctx.textAlign = 'center';
        ctx.fillText(v, x, y-10);
        ctx.textAlign = 'left';
        ctx.font = '11px sans-serif';
      }
    });
    legendHtml += '<div class="legend-item"><span class="legend-dot" style="background:'+color+'"></span>'+escapeHtml(s.name)+'</div>';
  });
  if(goalVal > 0){
    legendHtml += '<div class="legend-item"><span class="legend-dot" style="background:#e8b64a"></span>自分の目標 '+goalVal+'回</div>';
  }
  document.getElementById('legend').innerHTML = legendHtml || '<div class="empty">まだ記録がありません</div>';
}

/* ============================================================
   LIFF 初期化
   ============================================================ */
(function init(){
  if(typeof liff === 'undefined'){
    document.getElementById('who').textContent = 'LIFF未読込';
    return;
  }
  liff.init({ liffId: LIFF_ID })
    .then(function(){
      if(!liff.isLoggedIn()){ liff.login(); return; }
      return liff.getProfile();
    })
    .then(function(profile){
      if(!profile) return;
      USER = { userId: profile.userId, displayName: profile.displayName };
      document.getElementById('who').textContent = profile.displayName + ' さん';
      loadRanking();   // 自分の今週ベスト・目標を読み込んで目標カードに反映
    })
    .catch(function(err){
      document.getElementById('who').textContent = '初期化エラー';
      setMsg('LIFFの初期化に失敗しました：' + err, 'err');
    });
})();
